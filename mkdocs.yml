site_name: JsonPlot
site_description: A JSON contract and a DataFrame go in; a matplotlib figure comes out.
site_url: https://jmlopezfabian.github.io/JsonPlot/
repo_url: https://github.com/jmlopezfabian/JsonPlot
repo_name: jmlopezfabian/JsonPlot
edit_uri: edit/main/docs/

# The site is the repo's own docs/ directory: architecture.md and CONTRACT.md
# are already the documentation, and CONTRACT.md is generated and test-checked.
# Pages that would go stale are built by scripts/gen_docs.py instead of written.
docs_dir: docs
site_dir: site

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/chart-box-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Follow the system}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Switch to dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Switch to light}
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start here:
      - Quickstart: quickstart.md
      - Gallery: gallery.md
      - From the terminal: cli.md
      - In Streamlit: streamlit.md
  - For agents:
      - Driving it from an agent: agents.md
      - The contract: CONTRACT.md
      - A Pydantic AI agent: notebook.ipynb
  - Measured:
      - What pays the rent: blog/paying-the-rent.md
  - Reference:
      - Python API: api.md
      - Errors: errors.md
      - Architecture: architecture.md

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_docs.py
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            heading_level: 3
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jmlopezfabian/JsonPlot
