[project]
name = "jsonplot"
version = "0.1.0"
description = "A JSON contract plus a DataFrame renders a matplotlib or seaborn figure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesús Manuel López Fabián", email = "jmlopezfabian@gmail.com" }]
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
seaborn = ["seaborn>=0.13"]
streamlit = ["streamlit>=1.30"]

[project.scripts]
jsonplot = "jsonplot.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jsonplot-evals",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pydantic-ai>=2.38.0",
    "pytest>=8.0",
    "seaborn>=0.13",
    "streamlit>=1.30",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv.workspace]
# the eval harness is its own package, so its providers and tracing never
# become dependencies of jsonplot
members = ["evals"]

[tool.uv.sources]
jsonplot-evals = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonplot"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
